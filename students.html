<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista Estudiantes</title>
    <link rel="stylesheet" href="students.css">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
<header>
    <h1>Lista de Estudiantes</h1>
    <h2>Gestión de Estudiantes</h2>
    <input type="text" id="busquedaEst" placeholder="Buscar">
    <br><br>
</header>

<!-- Tabla -->
<table id="tablaEstudiantes">
    <thead>
        <tr>
            <th>Nombre</th>
            <th class="hihi">Identificación</th>
            <th>Curso</th>
            <th class="hihi">Ruta</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

    <!-- MODAL EDITAR ESTUDIANTE -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Editar Estudiante</h2>
            <form id="formEditar">
                <input type="text" id="editNombre" placeholder="Nombre">
                <input type="text" id="editId" placeholder="Identificación">
                <input type="text" id="editCurso" placeholder="Curso">
                <select id="editRuta">
                    <option value="Ruta Norte">Ruta Norte</option>
                    <option value="Ruta Sur">Ruta Sur</option>
                    <option value="Ruta Este">Ruta Este</option>
                    <option value="Ruta Oeste">Ruta Oeste</option>
                    <option value="Ruta Centro">Ruta Centro</option>
                </select>
                <button type="submit">Guardar cambios</button>
            </form>
            <button id="cerrarModal">Cerrar</button>
        </div>
    </div>
    <br>
    
    <br>
    <section id="estadisticas"></section>


    <script src="students.js"></script>
</body>

</html>
