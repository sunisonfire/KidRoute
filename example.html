<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas Seguras Kids</title>
    <link rel="stylesheet" href="example.css">
</head>

<body>

    <!-- ======================================== -->

    <!-- ======================================== -->

    <aside class="barraIzq">

        <div class="logo">

            <div>

                <h2>
                    Rutas Seguras
                </h2>

                <p>

                </p>

            </div>

        </div>

        <nav class="menu">

            <a href="rutas.html">

                <img src="/img/ruta.png" alt="home" class="loguito home">

            <a href="estudiantes.html">

                <img src="/img/estudiante.png" alt="home" class="loguito home">

            <a href="conductores.html">

                <img src="/img/conductor.png" alt="home" class="loguito home">


                Conductores

            </a>

        </nav>

    <div class="contenido">

        <header class="barraSuperior">

            <button class="menuHamburguesa" id="menuHamburguesa">

            <div class="busContenedor">
                <img src="/img/autobus.png" alt="bus" class="bus">

            <div class="logo">

            </div>

                </div>

            </div>

        <main class="principal">

            <section class="central">

                <div class="centralTitulo">

                    <span>
                        TRANSPORTE ESCOLAR

                    <h1>
                        Rutas Seguras Kids
                    </h1>

                    <p>

                    <button>
